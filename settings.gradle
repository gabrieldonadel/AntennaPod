pluginManagement {
  def reactNativeGradlePlugin = new File(
     providers.exec {
        workingDir(rootDir)
        commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
     }.standardOutput.asText.get().trim()
    ).getParentFile().absolutePath
    includeBuild(reactNativeGradlePlugin)

  def expoPluginsPath = new File(
    providers.exec {
      workingDir(rootDir)
      commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json', { paths: [require.resolve('expo/package.json')] })")
    }.standardOutput.asText.get().trim(),
    "../android/expo-gradle-plugin"
  ).absolutePath
  includeBuild(expoPluginsPath)

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        mavenLocal()
    }
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        mavenLocal()
    }
}

expoAutolinking {
  projectRoot = new File(rootDir, "exp")
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    try {
        ex.autolinkLibrariesFromCommand(expoAutolinking.rnConfigCommand,file(rootDir), files("yarn.lock"))
    } catch (Exception e) {
        println("Error: ${e}")
        println("Failed to autolink libraries from command: ${expoAutolinking.rnConfigCommand}")
        throw e
    }
}

expoAutolinking.useExpoModules()
expoAutolinking.useExpoVersionCatalog()

include ':app'
include ':event'
include ':model'

includeBuild(expoAutolinking.reactNativeGradlePlugin)

include ':net:common'
include ':net:discovery'
include ':net:download:service-interface'
include ':net:download:service'
include ':net:ssl'
include ':net:sync:gpoddernet'
include ':net:sync:service-interface'
include ':net:sync:service'

include ':parser:feed'
include ':parser:media'
include ':parser:transcript'

include ':playback:base'
include ':playback:cast'
include ':playback:service'

include ':storage:database'
include ':storage:importexport'
include ':storage:preferences'

include ':ui:app-start-intent'
include ':ui:chapters'
include ':ui:common'
include ':ui:discovery'
include ':ui:echo'
include ':ui:episodes'
include ':ui:glide'
include ':ui:i18n'
include ':ui:notifications'
include ':ui:preferences'
include ':ui:statistics'
include ':ui:widget'
include ':ui:transcript'
